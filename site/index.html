<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bullion Analysis — Nepal vs the world price</title>
<style>
  :root{
    --bg:#faf9f7; --panel:#fff; --ink:#1a1714; --muted:#6b635a; --line:#e6e1d9;
    --gold:#b8862b; --gold-soft:#f0e3c8; --silver:#8a8d93;
    --up:#b23c2e; --down:#2f7a55; --accent:#1f4e79;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]){
      --bg:#14120f; --panel:#1d1a16; --ink:#f0ebe3; --muted:#a09688; --line:#332e27;
      --gold:#d9a842; --gold-soft:#3a2f1a; --silver:#9fa3aa;
      --up:#e8705c; --down:#57b685; --accent:#7fb3e0;
    }
  }
  :root[data-theme=dark]{
    --bg:#14120f; --panel:#1d1a16; --ink:#f0ebe3; --muted:#a09688; --line:#332e27;
    --gold:#d9a842; --gold-soft:#3a2f1a; --silver:#9fa3aa;
    --up:#e8705c; --down:#57b685; --accent:#7fb3e0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:32px 20px 72px}
  header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}
  h1{font-size:1.45rem;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.9rem}
  .headline{font-size:1.15rem;line-height:1.45;margin:22px 0 28px;padding:16px 18px;
    background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0 8px 8px 0}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-bottom:28px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .card .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
  .card .value{font-size:1.5rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .card .note{font-size:.8rem;color:var(--muted);margin-top:6px}
  .card.hero{background:linear-gradient(135deg,var(--gold-soft),var(--panel));border-color:var(--gold)}
  .card.hero .value{font-size:1.85rem;color:var(--gold)}
  h2{font-size:1rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
    margin:36px 0 14px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  tbody tr:last-child td{border-bottom:none}
  .scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 14px}
  .up{color:var(--up)} .down{color:var(--down)}
  figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  figcaption{font-size:.82rem;color:var(--muted);margin-top:10px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  /* ---- live ticker ---- */
  .live{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-bottom:12px}
  .metal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;position:relative;overflow:hidden}
  .metal.gold{border-color:var(--gold)}
  .metal.gold::before,.metal.silver::before{content:"";position:absolute;inset:0 0 auto 0;height:3px}
  .metal.gold::before{background:linear-gradient(90deg,var(--gold),transparent)}
  .metal.silver::before{background:linear-gradient(90deg,var(--silver),transparent)}
  .metal h3{margin:0 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
  .big{font-size:2.05rem;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.15;
    transition:color .35s ease}
  .metal.gold .big{color:var(--gold)}
  .metal.silver .big{color:var(--silver)}
  .big.flash-up{color:var(--up)!important} .big.flash-down{color:var(--down)!important}
  .units{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:.82rem;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .units b{color:var(--ink);font-weight:600}
  .metal .rule{border-top:1px solid var(--line);margin:14px 0 11px}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:.82rem;padding:3px 0}
  .kv span:first-child{color:var(--muted)}
  .kv span:last-child{font-variant-numeric:tabular-nums}
  .livebar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 14px;font-size:.82rem;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--down);flex:none;
    box-shadow:0 0 0 0 rgba(47,122,85,.55);animation:pulse 2.4s infinite}
  .dot.stale{background:var(--muted);animation:none}
  .dot.dead{background:var(--up);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,122,85,.5)}70%{box-shadow:0 0 0 7px rgba(47,122,85,0)}100%{box-shadow:0 0 0 0 rgba(47,122,85,0)}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}.big{transition:none}}
  .flags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .flag{font:600 .7rem/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;
    padding:6px 9px;border-radius:5px;background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold)}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);
    font-size:.82rem;color:var(--muted)}
  code{font:.85em var(--mono);background:var(--gold-soft);padding:1px 5px;border-radius:3px}
  .err{padding:20px;border:1px solid var(--up);border-radius:10px;color:var(--up)}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading…</p></div>

<script>
const npr = n => n==null ? '—' : 'NPR ' + Number(n).toLocaleString('en-IN');
const pct = (n,d=2) => n==null ? '—' : (n>0?'+':'') + Number(n).toFixed(d) + '%';
const cls = n => n==null ? '' : n>0 ? 'up' : n<0 ? 'down' : '';
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

fetch('analysis.json?' + Date.now())
  .then(r => { if(!r.ok) throw new Error('analysis.json not found (HTTP '+r.status+')'); return r.json(); })
  .then(render)
  .catch(e => {
    document.getElementById('app').innerHTML =
      '<div class="err"><strong>Could not load data.</strong><br>' + esc(e.message) +
      '<br><br>Run <code>npm run fetch &amp;&amp; npm run analyse</code>, then reload.</div>';
  });

function render(a){
  const m = a.measured, ind = a.indicated;
  const h = [];

  h.push(`<header>
    <h1>Bullion Analysis — Nepal vs the world price</h1>
    <div class="sub">World price as of ${esc(a.asOf.record)} · Nepali rate measured ${esc(a.asOf.nepalMeasured)}${
      a.asOf.isLive ? ' (live)' : ` (${a.asOf.staleDays} day${a.asOf.staleDays===1?'':'s'} ago — market closed)`}</div>
  </header>`);

  h.push(`<div class="headline">${esc(a.headline)}</div>`);

  // Live Nepali price. FENEGOSIDA prints once a day and then sits still; the
  // world price does not. These two cards carry each tick through Nepal's
  // duty, VAT and margin so the rupee figure moves with the market.
  h.push(`<div class="livebar">
    <span class="dot" id="live-dot"></span>
    <span id="live-status">Connecting to the live feed…</span>
    <span>·</span>
    <span>Rupee held at the NRB daily rate (${a.fx.usdNpr}, ${esc(a.fx.asOf)}) — NRB publishes once a day</span>
  </div>`);

  h.push(`<div class="live">
    ${metalCard('gold', 'Gold — live Nepali rate', a)}
    ${metalCard('silver', 'Silver — live Nepali rate', a)}
  </div>`);

  h.push(`<p class="sub" style="margin:0 0 30px">
    <strong>Market rate</strong> applies the markup actually measured against FENEGOSIDA
    (${pct(a.live.gold.measuredMarkupPct)} gold, ${pct(a.live.silver.measuredMarkupPct)} silver) — it already contains
    duty, VAT and margin, and assumes nothing about any of them.
    <strong>Statutory build-up</strong> adds each cost explicitly from
    <code>config/parameters.json</code>. For gold those are independent, and they currently agree to within
    ${Math.abs(a.buildUp.impliedMarkupPct - a.measured.premiumPct).toFixed(1)}pp. For silver the duty was back-solved
    from observed prices, so its ladder describes the markup rather than confirming it.
  </p>`);

  h.push(`<div class="grid">
    <div class="card">
      <div class="label">World gold — daily record</div>
      <div class="value">$${a.international.goldUsdPerOz.toLocaleString('en-US')}</div>
      <div class="note">the ${esc(a.asOf.record)} snapshot everything below is computed from · $${a.international.goldUsdPerGram}/g</div>
    </div>
    <div class="card">
      <div class="label">Local markup</div>
      <div class="value">${pct(m.premiumPct)}</div>
      <div class="note">${m.percentile}th percentile of ${m.historyDays} days · median ${pct(m.medianPct)}</div>
    </div>
    <div class="card">
      <div class="label">USD / NPR</div>
      <div class="value">${a.fx.usdNpr}</div>
      <div class="note">NRB selling, ${esc(a.fx.asOf)}</div>
    </div>
  </div>`);

  if(!a.asOf.isLive && ind.repriceGapPct != null){
    h.push(`<div class="card" style="margin-bottom:28px">
      <div class="label">Pending repricing</div>
      <div class="value ${cls(ind.repriceGapPct)}">${pct(ind.repriceGapPct,1)}</div>
      <div class="note">Last published ${npr(ind.lastPublishedNprPerTola)} on ${esc(a.asOf.nepalMeasured)}.
        Carrying the ${pct(ind.usingPremiumPct)} markup onto today's world price and rupee gives
        ${npr(ind.nprPerTola)} — a gap of ${npr(ind.repriceGapNpr)} per tola.</div>
    </div>`);
  }

  // --- the premium chart is the point of the whole project ---
  h.push('<h2>Local markup over world parity</h2>');
  h.push(`<figure>${lineChart(a.series.map(s=>({x:s.d,y:s.premium})), {
    band:[m.medianPct], fmt:v=>v.toFixed(0)+'%', color:'var(--gold)'
  })}<figcaption>Each point is a day on which both a world price and a same-day Nepali rate exist.
  Dashed line is the median of the current regime (${pct(m.medianPct)}). Customs duty and VAT are near-fixed,
  so within one regime movement here is the local market, not the tax code.</figcaption></figure>`);

  if(m.regimeShift){
    const r = m.regimeShift;
    h.push(`<div class="card" style="margin-top:14px;border-color:var(--gold)">
      <div class="label">Regime break — ${esc(r.date)}</div>
      <div class="note" style="margin-top:0">The markup stepped ${r.stepPp>0?'up':'down'} from ${pct(r.beforePct)}
        to ${pct(r.afterPct)} (${r.stepPp>0?'+':''}${r.stepPp}pp) and held — the signature of a Finance Act duty
        change, not a market move. The percentile above ranks only the ${r.rankedAgainstDaysSince} observations
        since then; ranking across the break would measure a tax change rather than today's market.</div>
    </div>`);
  }

  h.push('<h2>Nepali rate against world parity</h2>');
  h.push(`<figure>${dualChart(a.series)}<figcaption>Gold (solid) is the published FENEGOSIDA rate per tola.
  Parity (faint) is the same tola valued at the world price and the NRB rupee, before any Nepali cost.
  The space between them is the markup.</figcaption></figure>`);

  h.push('<h2>What a tola should cost — the cost ladder</h2>');
  h.push(`<div class="scroll"><table><thead><tr><th>Step</th><th>Adds</th><th>Running total / tola</th></tr></thead><tbody>`);
  for(const s of a.buildUp.steps){
    h.push(`<tr><td>${esc(s.label)}</td><td>${s.add==null?'—':npr(s.add)}</td><td>${npr(s.amount)}</td></tr>`);
  }
  h.push(`<tr><td><strong>Expected retail</strong></td><td></td><td><strong>${npr(a.buildUp.expectedRetailNprPerTola)}</strong></td></tr>`);
  h.push('</tbody></table></div>');
  h.push(`<p class="sub" style="margin-top:12px">Ladder total ${pct(a.buildUp.impliedMarkupPct)} vs markup
    measured at ${pct(m.premiumPct)}. The ladder rests on editable assumptions in
    <code>config/parameters.json</code>; the measured figure does not.</p>`);

  if(a.moves?.length){
    h.push('<h2>What moved, and why</h2>');
    h.push('<div class="scroll"><table><thead><tr><th>Window</th><th>World gold</th><th>USD/NPR</th><th>Nepali rate</th><th>Markup</th></tr></thead><tbody>');
    for(const mv of a.moves){
      h.push(`<tr><td>${esc(mv.label)}</td>
        <td class="${cls(mv.spotPct)}">${pct(mv.spotPct,1)}</td>
        <td class="${cls(mv.fxPct)}">${pct(mv.fxPct,1)}</td>
        <td class="${cls(mv.nepalPct)}">${pct(mv.nepalPct,1)}</td>
        <td class="${cls(mv.premiumPointChange)}">${mv.premiumPointChange==null?'—':(mv.premiumPointChange>0?'+':'')+mv.premiumPointChange.toFixed(1)+'pp'}</td></tr>`);
    }
    h.push('</tbody></table></div>');
  }

  h.push('<div id="forecast-slot"></div>');

  if(a.flags?.length){
    h.push('<div class="flags">' + a.flags.map(f=>`<span class="flag">${esc(f)}</span>`).join('') + '</div>');
  }

  h.push(`<footer>Generated ${esc(a.generatedAt)} · ${m.historyDays} same-day observations ·
    sources: ${esc(a.international.source)}, ${esc(a.fx.source)}, FENEGOSIDA.<br>
    Information only, not investment advice. Dealer buy/sell spreads are not reflected in any figure here.</footer>`);

  document.getElementById('app').innerHTML = h.join('');
  startLive(a);

  // The outlook is a separate file so a failure to produce it never takes the
  // rest of the dashboard down with it.
  fetch('forecast.json?' + Date.now())
    .then(r => r.ok ? r.json() : null)
    .then(f => { if(f) renderForecast(f, a); })
    .catch(() => {});
}

function renderForecast(f, a){
  const slot = document.getElementById('forecast-slot');
  if(!slot) return;
  const p = f.projection, d = f.drivers, b = f.backtest;
  const h = [];

  h.push('<h2>One-week outlook</h2>');
  h.push(`<p class="sub" style="margin:-4px 0 16px">At five sessions world gold is close to a random walk, so it is given
    <strong>no drift</strong> — the central case is where it is now. What is forecast here is the Nepali markup, which
    mean-reverts measurably (half-life ${d.ar1HalfLifeSessions} sessions, R² ${d.ar1R2}). Read the band, not the mid-point.</p>`);

  h.push(`<div class="grid">
    <div class="card hero">
      <div class="label">Central, 5 sessions out</div>
      <div class="value">${npr(p.centralNprPerTola)}</div>
      <div class="note">${pct(p.centralChangePct)} from ${npr(f.basis.nprPerTola)} on ${esc(f.basis.date)}</div>
    </div>
    <div class="card">
      <div class="label">68% band</div>
      <div class="value" style="font-size:1.1rem">${npr(p.band68.lo)}<br>— ${npr(p.band68.hi)}</div>
      <div class="note">±${d.combinedSdPct}% combined</div>
    </div>
    <div class="card">
      <div class="label">95% band</div>
      <div class="value" style="font-size:1.1rem">${npr(p.band95.lo)}<br>— ${npr(p.band95.hi)}</div>
      <div class="note">the realistic worst and best case</div>
    </div>
    <div class="card">
      <div class="label">Markup reversion</div>
      <div class="value">${d.markupMovePp > 0 ? '+' : ''}${d.markupMovePp}pp</div>
      <div class="note">${pct(d.markupNowPct,1)} → ${pct(d.markupExpectedPct,1)} · ${((1-d.decayFactor)*100).toFixed(0)}% of the stretch decays</div>
    </div>
  </div>`);

  h.push(`<figure>${coneChart(a.series, f)}<figcaption>Solid gold is the published Nepali rate.
    The shaded cone is the projection: darker is the 68% band, lighter the 95%. It tilts
    ${p.centralChangePct < 0 ? 'down' : 'up'} because the markup is currently ${pct(d.markupNowPct,1)} against a trailing
    median of ${pct(f.basis.markupTrailingMedianPct,1)}, not because of any view on world gold.</figcaption></figure>`);

  if(b){
    const ok = Math.abs(b.coverage68Pct-68) <= 10 && Math.abs(b.coverage95Pct-95) <= 7;
    h.push(`<div class="card" style="margin-top:16px;border-color:${ok ? 'var(--down)' : 'var(--up)'}">
      <div class="label">Does this method work? — ${b.n} out-of-sample tests</div>
      <div class="note" style="margin-top:2px">
        The 68% band actually contained the outcome <strong>${b.coverage68Pct}%</strong> of the time;
        the 95% band, <strong>${b.coverage95Pct}%</strong>. Median absolute error ${b.medianAbsErrorPct}%,
        worst ${b.worstErrorPct}%. Refit at each step on only the data available then.
        ${ok ? 'Both bands are close to honest.' : '<strong>The bands are miscalibrated — weight this projection accordingly.</strong>'}
      </div>
    </div>`);
  }

  h.push('<h2>If world gold does X</h2>');
  h.push('<div class="scroll"><table><thead><tr><th>World gold</th><th>Spot</th><th>Markup then</th><th>Nepali rate</th><th>vs now</th></tr></thead><tbody>');
  for(const s of f.scenarios){
    h.push(`<tr><td>${s.spotPct>0?'+':''}${s.spotPct}%</td><td>$${s.spotUsdOz}</td>
      <td>${pct(s.markupPct,1)}</td><td><strong>${npr(s.nprPerTola)}</strong></td>
      <td class="${cls(s.changePct)}">${pct(s.changePct,1)}</td></tr>`);
  }
  h.push('</tbody></table></div>');
  h.push(`<p class="sub" style="margin-top:12px">The Nepali column moves less than the world column — local prices are
    sticky, absorbing about ${Math.abs(d.stickinessPpPerPctSpot).toFixed(2)}pp of every 1% spot move
    (correlation ${d.spotMarkupCorr}). That narrows the band by ${d.stickinessDampeningPct}% versus treating the two
    legs as independent, and is invisible to any generic gold forecast.</p>`);

  const t = f.technicals?.gold;
  if(t){
    h.push('<h2>Technical state — world gold</h2>');
    h.push(`<div class="scroll"><table><tbody>
      <tr><td>Trend</td><td>${esc(t.trend)}${t.recentCross ? ' · <strong>'+esc(t.recentCross)+'</strong>' : ''}</td></tr>
      <tr><td>Last / 50-day / 200-day</td><td>$${fmtUsd(t.last)} · $${fmtUsd(t.sma50)} · $${fmtUsd(t.sma200)}</td></tr>
      <tr><td>Distance from 50 / 200-day</td><td>${pct(t.pctFromSma50,1)} · ${pct(t.pctFromSma200,1)}</td></tr>
      <tr><td>RSI(14)</td><td>${t.rsi14?.toFixed(0) ?? '—'}</td></tr>
      <tr><td>Resistance above</td><td>${t.resistance?.length ? t.resistance.map(v=>'$'+fmtUsd(v)).join(' · ') : 'none in lookback'}</td></tr>
      <tr><td>Support below</td><td>${t.support?.length ? t.support.map(v=>'$'+fmtUsd(v)).join(' · ') : '<strong>none</strong> — at or below every swing low in the lookback'}</td></tr>
    </tbody></table></div>`);
    h.push(`<p class="sub" style="margin-top:12px">These describe the chart; they are not what drives the projection
      above. At a one-week horizon the volatility estimate carries far more information than any level here.</p>`);
  }

  h.push(`<p class="sub" style="margin-top:22px;padding:14px 16px;border:1px solid var(--line);border-radius:8px">
    <strong>Information only — not investment advice.</strong> This is a statistical description of published prices.
    Dealer buy/sell spreads alone exceed most of the moves projected here, and gold in Nepal is a hold-for-years asset
    rather than a weekly trade.</p>`);

  slot.innerHTML = h.join('');
}

function fmtUsd(n){ return n==null ? '—' : Number(n).toLocaleString('en-US',{maximumFractionDigits:0}); }

/** History plus a forward cone. The cone starts exactly at the last actual. */
function coneChart(series, f){
  const tail = series.filter(s=>s.actual!=null).slice(-45);
  if(tail.length < 5) return '<p class="sub">Not enough history to plot.</p>';
  const H = f.horizonSessions, p = f.projection;
  const last = tail[tail.length-1].actual;

  const W=900, HT=300, L=68, R=58, T=14, B=28;
  const all = tail.map(s=>s.actual).concat([p.band95.lo, p.band95.hi]);
  const lo = Math.min(...all), hi = Math.max(...all);
  const span = (hi-lo)||1, y0 = lo-span*0.08, y1 = hi+span*0.08;
  const total = tail.length - 1 + H;
  const x = i => L + (i/total)*(W-L-R);
  const y = v => T + (1-(v-y0)/(y1-y0))*(HT-T-B);

  // Bands widen with the square root of elapsed sessions, matching how the
  // variance actually accumulates - a straight taper would overstate the
  // near days and understate the far ones.
  const grow = k => Math.sqrt(k/H);
  const band = (loV,hiV) => {
    const up=[], dn=[];
    for(let k=0;k<=H;k++){
      const i = tail.length-1+k, g = grow(k);
      up.push(`${x(i).toFixed(1)},${y(last + (hiV-last)*g).toFixed(1)}`);
      dn.push(`${x(i).toFixed(1)},${y(last + (loV-last)*g).toFixed(1)}`);
    }
    return 'M' + up.join('L') + 'L' + dn.reverse().join('L') + 'Z';
  };

  let g = `<svg viewBox="0 0 ${W} ${HT}" role="img" aria-label="Nepali gold rate with a five-session projection cone">`;
  for(let t=0;t<=4;t++){
    const v = y0+(y1-y0)*t/4, yy=y(v);
    g += `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)"/>`;
    g += `<text x="${L-9}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${(v/1000).toFixed(0)}k</text>`;
  }
  g += `<path d="${band(p.band95.lo,p.band95.hi)}" fill="var(--gold)" opacity=".13"/>`;
  g += `<path d="${band(p.band68.lo,p.band68.hi)}" fill="var(--gold)" opacity=".26"/>`;

  const hist = tail.map((s,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(s.actual).toFixed(1)}`).join('');
  g += `<path d="${hist}" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linejoin="round"/>`;
  g += `<path d="M${x(tail.length-1).toFixed(1)},${y(last).toFixed(1)}L${x(total).toFixed(1)},${y(p.centralNprPerTola).toFixed(1)}"
    stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4" fill="none"/>`;
  g += `<line x1="${x(tail.length-1)}" y1="${T}" x2="${x(tail.length-1)}" y2="${HT-B}" stroke="var(--muted)" stroke-dasharray="2 4" opacity=".5"/>`;
  g += `<circle cx="${x(total)}" cy="${y(p.centralNprPerTola)}" r="4" fill="var(--gold)"/>`;
  g += `<text x="${x(total)+7}" y="${y(p.centralNprPerTola)+4}" font-size="11" fill="var(--gold)" font-weight="600">${Math.round(p.centralNprPerTola/1000)}k</text>`;
  g += `<text x="${x(tail.length-1)+5}" y="${HT-9}" font-size="10.5" fill="var(--muted)">now</text>`;

  const step = Math.max(1, Math.floor(tail.length/5));
  for(let i=0;i<tail.length;i+=step){
    g += `<text x="${x(i)}" y="${HT-9}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${tail[i].d.slice(5)}</text>`;
  }
  return g + '</svg>';
}

/* ---- live Nepali price ---------------------------------------------------
   The world price moves all day; FENEGOSIDA prints once and stops. Poll spot,
   run it through the same arithmetic the backend uses, and show the rupee
   figure that implies right now.

   The rupee leg is deliberately held fixed: NRB publishes once a day, so the
   daily rate is the correct one to carry until tomorrow's run. Only the metal
   price is live.                                                            */

function metalCard(metal, title, a){
  const m = a.live[metal];
  const last = m.lastPublishedNprPerTola;
  return `<div class="metal ${metal}">
    <h3>${title}</h3>
    <div class="big" id="${metal}-market">—</div>
    <div class="units">
      <span><b id="${metal}-10g">—</b> / 10 g</span>
      <span><b id="${metal}-g">—</b> / gram</span>
    </div>
    <div class="rule"></div>
    <div class="kv"><span>Spot</span><span id="${metal}-spot">—</span></div>
    <div class="kv"><span>World parity</span><span id="${metal}-parity">—</span></div>
    <div class="kv"><span>Statutory build-up${m.ladderIsCalibrated ? ' *' : ''}</span><span id="${metal}-statutory">—</span></div>
    <div class="kv"><span>FENEGOSIDA ${esc(m.lastPublishedDate)}</span><span>${last == null ? '—' : npr(last)}</span></div>
    <div class="kv"><span>vs that print</span><span id="${metal}-delta">—</span></div>
  </div>`;
}

function nepalFrom(spotUsdOz, L, m){
  const c = L.constants;
  const parityTola = (spotUsdOz / c.gramsPerTroyOunce) * L.usdNpr * c.gramsPerTola;
  const d = m.ladder;
  // Same ladder order as lib/parity.mjs: handling -> duty -> VAT -> margin.
  const cif = parityTola * (1 + d.importHandlingRate);
  const landed = cif + (d.customsDutyNprPer10g / 10) * c.gramsPerTola;
  const statutory = landed * (1 + d.vatRate) * (1 + d.dealerMarginRate);
  return {
    parityTola,
    market: parityTola * (1 + m.measuredMarkupPct / 100),
    statutory,
  };
}

function startLive(a){
  const L = a.live;
  if(!L || !L.endpoints){ return; }

  const dot = document.getElementById('live-dot');
  const status = document.getElementById('live-status');
  const prev = {};
  let lastOk = 0, timer = null;

  const setText = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };

  function paint(metal, spot){
    const m = L[metal];
    if(!(spot > 0) || m.measuredMarkupPct == null) return;
    const p = nepalFrom(spot, L, m);
    const c = L.constants;

    const el = document.getElementById(metal + '-market');
    if(el && prev[metal] != null && Math.abs(p.market - prev[metal]) > 0.5){
      const cl = p.market > prev[metal] ? 'flash-up' : 'flash-down';
      el.classList.add(cl);
      setTimeout(() => el.classList.remove(cl), 900);
    }
    prev[metal] = p.market;

    setText(metal + '-market', npr(Math.round(p.market)));
    setText(metal + '-10g',  npr(Math.round(p.market / c.gramsPerTola * 10)));
    setText(metal + '-g',    npr(Math.round(p.market / c.gramsPerTola)));
    setText(metal + '-spot', '$' + spot.toLocaleString('en-US', {maximumFractionDigits: metal === 'gold' ? 1 : 2}) + ' / oz');
    setText(metal + '-parity', npr(Math.round(p.parityTola)));
    setText(metal + '-statutory', npr(Math.round(p.statutory)));

    const last = m.lastPublishedNprPerTola;
    const dEl = document.getElementById(metal + '-delta');
    if(dEl && last){
      const dp = (p.market / last - 1) * 100;
      dEl.textContent = pct(dp, 1) + ' (' + npr(Math.round(p.market - last)) + ')';
      dEl.className = cls(dp);
    }
  }

  async function tick(){
    try {
      const [xau, xag] = await Promise.all([
        fetch(L.endpoints.xau, {cache:'no-store'}).then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP '+r.status))),
        fetch(L.endpoints.xag, {cache:'no-store'}).then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP '+r.status))),
      ]);
      paint('gold', Number(xau.price));
      paint('silver', Number(xag.price));
      lastOk = Date.now();
      dot.className = 'dot';
      status.textContent = 'Live — updated just now, every ' + L.pollSeconds + 's';
    } catch (err) {
      // Never blank out a good number because one poll failed; say it is old.
      const age = lastOk ? Math.round((Date.now() - lastOk)/1000) : null;
      if(age == null){
        dot.className = 'dot dead';
        status.textContent = 'Live feed unreachable — showing today\'s fixed figures below instead';
        fallbackToDaily(a);
      } else {
        dot.className = 'dot stale';
        status.textContent = 'Live feed stalled — last good tick ' + fmtAge(age) + ' ago';
      }
    }
  }

  function heartbeat(){
    if(!lastOk) return;
    const age = Math.round((Date.now() - lastOk)/1000);
    if(age > L.staleAfterSeconds){
      dot.className = 'dot stale';
      status.textContent = 'Live feed stalled — last good tick ' + fmtAge(age) + ' ago';
    } else if(age > 5){
      status.textContent = 'Live — updated ' + fmtAge(age) + ' ago, every ' + L.pollSeconds + 's';
    }
  }

  function schedule(){
    clearInterval(timer);
    timer = setInterval(tick, Math.max(15, L.pollSeconds) * 1000);
  }

  // Polling a public endpoint from a hidden tab is just rudeness; stop when
  // the page is not being looked at, and refresh immediately on return.
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ clearInterval(timer); }
    else { tick(); schedule(); }
  });

  tick();
  schedule();
  setInterval(heartbeat, 5000);
}

function fallbackToDaily(a){
  // No live feed: show the figures the scheduled run already computed.
  const c = a.live.constants;
  for(const [metal, val] of [['gold', a.indicated.nprPerTola], ['silver', a.indicated.silverNprPerTola]]){
    if(val == null) continue;
    const set = (id,v) => { const e = document.getElementById(id); if(e) e.textContent = v; };
    set(metal + '-market', npr(val));
    set(metal + '-10g', npr(Math.round(val / c.gramsPerTola * 10)));
    set(metal + '-g', npr(Math.round(val / c.gramsPerTola)));
    set(metal + '-spot', '$' + a.live[metal].baselineSpotUsdOz + ' / oz (daily)');
  }
}

function fmtAge(s){
  if(s < 60) return s + 's';
  if(s < 3600) return Math.round(s/60) + 'm';
  return Math.round(s/3600) + 'h';
}

/* ---- charts: hand-rolled SVG, no libraries, no network ---- */

function scale(vals, pad=0.08){
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi-lo) || Math.abs(hi) || 1;
  return { lo: lo - span*pad, hi: hi + span*pad };
}

function lineChart(pts, {band=[], fmt=v=>v.toFixed(0), color='var(--gold)'}={}){
  if(pts.length < 2) return '<p class="sub">Not enough data to plot.</p>';
  const W=900, H=260, L=52, R=12, T=14, B=28;
  const ys = pts.map(p=>p.y).concat(band);
  const {lo,hi} = scale(ys);
  const x = i => L + (i/(pts.length-1))*(W-L-R);
  const y = v => T + (1-(v-lo)/(hi-lo))*(H-T-B);

  const path = pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const area = path + `L${x(pts.length-1).toFixed(1)},${H-B}L${x(0).toFixed(1)},${H-B}Z`;

  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Local markup over world parity, percent">`;
  g += `<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${color}" stop-opacity=".22"/>
    <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;

  for(let t=0;t<=4;t++){
    const v = lo + (hi-lo)*t/4, yy = y(v);
    g += `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L-9}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;
  }
  g += `<path d="${area}" fill="url(#fade)"/>`;
  g += `<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  for(const b of band){
    g += `<line x1="${L}" y1="${y(b)}" x2="${W-R}" y2="${y(b)}" stroke="var(--muted)"
      stroke-width="1" stroke-dasharray="5 4" opacity=".75"/>`;
  }
  const last = pts[pts.length-1];
  g += `<circle cx="${x(pts.length-1)}" cy="${y(last.y)}" r="4" fill="${color}"/>`;
  const step = Math.max(1, Math.floor(pts.length/6));
  for(let i=0;i<pts.length;i+=step){
    g += `<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${pts[i].x.slice(5)}</text>`;
  }
  return g + '</svg>';
}

function dualChart(series){
  if(series.length < 2) return '<p class="sub">Not enough data to plot.</p>';
  const W=900,H=280,L=68,R=12,T=14,B=28;
  const all = series.flatMap(s=>[s.actual,s.parity]).filter(Number.isFinite);
  const {lo,hi} = scale(all);
  const x = i => L + (i/(series.length-1))*(W-L-R);
  const y = v => T + (1-(v-lo)/(hi-lo))*(H-T-B);
  const line = key => series.map((s,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(s[key]).toFixed(1)}`).join('');

  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Nepali published rate against world parity, NPR per tola">`;
  for(let t=0;t<=4;t++){
    const v = lo+(hi-lo)*t/4, yy=y(v);
    g += `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)"/>`;
    g += `<text x="${L-9}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${(v/1000).toFixed(0)}k</text>`;
  }
  g += `<path d="${line('parity')}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".8"/>`;
  g += `<path d="${line('actual')}" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linejoin="round"/>`;
  const step = Math.max(1, Math.floor(series.length/6));
  for(let i=0;i<series.length;i+=step){
    g += `<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${series[i].d.slice(5)}</text>`;
  }
  g += `<text x="${W-R}" y="${y(series[series.length-1].actual)-9}" text-anchor="end" font-size="11" fill="var(--gold)" font-weight="600">Nepali rate</text>`;
  g += `<text x="${W-R}" y="${y(series[series.length-1].parity)+16}" text-anchor="end" font-size="11" fill="var(--muted)">world parity</text>`;
  return g + '</svg>';
}
