name: Daily fetch and analysis

# FENEGOSIDA stamps its publication around 04:45 UTC (10:30 Kathmandu), so
# there is nothing new to collect before then.
#
# One alarm is not enough. A lone '15 5 * * *' was honoured seven to eight
# hours late on every consecutive day it ran - 13:03, 12:07 and 12:41 UTC -
# which put the morning's print on the site at about 18:00 NPT, long after
# anyone had looked. GitHub promises no latency for scheduled runs and queues
# the popular minutes (:00, :15, :30) hardest, so the fix is several attempts
# at unpopular minutes rather than one hopeful alarm.
#
# The extra attempts are nearly free. The collector upserts by date, so a run
# that fires before the print writes a record without a Nepali rate and a
# later one replaces it wholesale; whichever attempt GitHub honours first
# after the print is the one that publishes, and the rest find the work done.

on:
  schedule:
    - cron: '52 4 * * *'   # 10:37 NPT - minutes after the print
    - cron: '37 5 * * *'   # 11:22 NPT
    - cron: '43 6 * * *'   # 12:28 NPT
    - cron: '47 8 * * *'   # 14:32 NPT - last chance before the evening
  workflow_dispatch:
    inputs:
      force_email:
        description: 'Send the digest even if nothing is flagged'
        type: boolean
        default: false

permissions:
  contents: write   # commit the day's record back to the repo
  pages: write      # publish the dashboard
  id-token: write

# Never let two runs race on the same history file.
concurrency:
  group: bullion-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A hung fetch must not sit there burning Actions minutes.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Only the mailer needs anything from npm; the collector and the analysis
      # run on the standard library alone.
      - run: npm install --omit=dev --no-audit --no-fund

      - name: Fetch today's prices
        run: node scripts/fetch.mjs

      - name: Analyse
        run: node scripts/analyse.mjs

      # Non-fatal: the outlook is an extra, and a Yahoo hiccup must not cost
      # us the day's price record.
      - name: One-week outlook
        continue-on-error: true
        run: node scripts/forecast.mjs

      - name: Email
        continue-on-error: true   # a mail outage must not fail the data job
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          FORCE: ${{ inputs.force_email }}
        run: |
          if [ -z "$SMTP_HOST" ]; then
            echo "No SMTP_HOST secret set - skipping email."
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            node scripts/notify.mjs --weekly
          else
            node scripts/notify.mjs
          fi

      # Mail before committing, not after: notify.mjs leaves a marker naming the
      # day it last sent, and the commit below is what carries that marker to
      # the next attempt. A failed send writes no marker, so the next attempt
      # tries again.
      - name: Commit the day's record
        run: |
          git config user.name  "bullion-bot"
          git config user.email "bullion-bot@users.noreply.github.com"
          git add data/ reports/ site/analysis.json site/forecast.json
          if git diff --staged --quiet; then
            echo "Nothing changed - no commit."
          else
            git commit -m "data: $(date -u +%Y-%m-%d) rates and analysis"
            # Rebase in case a human pushed between checkout and now.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
